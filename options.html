<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="blacklistTitle">Site Blacklist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff8f0 0%, #ffe8d6 100%);
      padding: 30px;
      color: #333;
      min-height: 100vh;
    }
    body[dir="rtl"] {
      font-family: Tahoma, -apple-system, sans-serif;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px solid #e0e0e0;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #ff6b35 0%, #ffa726 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    h1 {
      font-size: 22px;
      color: #ff6b35;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-top: 4px;
    }
    .lang-select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .lang-select:hover { border-color: #ff6b35; }
    .lang-select:focus {
      border-color: #ff6b35;
      box-shadow: 0 0 0 2px rgba(255, 107, 53, 0.2);
    }
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #ff6b35;
    }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff6b35 0%, #ffa726 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
    }
    button.danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      padding: 6px 12px;
      font-size: 12px;
    }
    .site-list { list-style: none; }
    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f9f9f9;
      border-radius: 10px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .site-item:hover { background: #fff3e0; }
    .site-name {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .site-icon {
      width: 28px;
      height: 28px;
      background: #ff6b35;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 14px;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 8px;
      border-right: 3px solid #ffa726;
    }
    body[dir="rtl"] .hint {
      border-right: none;
      border-left: 3px solid #ffa726;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🦦</div>
      <div class="header-text">
        <h1 data-i18n="blacklistTitle">Site Blacklist</h1>
        <div class="subtitle" data-i18n="blacklistSubtitle">The extension will be disabled on these sites</div>
      </div>
      <select class="lang-select" id="languageSelector">
        <option value="auto" data-i18n="languageAuto">🔄 Auto</option>
        <option value="en" data-i18n="languageEn">🇬🇧 English</option>
        <option value="fa" data-i18n="languageFa">🇮🇷 فارسی</option>
      </select>
    </div>

    <div class="add-form">
      <input type="text" id="newSite" data-i18n-placeholder="addSitePlaceholder" placeholder="example.com" dir="ltr">
      <button id="addBtn" data-i18n="addButton">➕ Add</button>
    </div>

    <div class="hint" data-i18n="blacklistHint">💡 Enter the domain (e.g. youtube.com). The extension will automatically disable on all subdomains.</div>

    <ul class="site-list" id="siteList"></ul>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
